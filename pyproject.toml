[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-smoker-monitor"
version = "0.1.0"
description = "Raspberry Pi monitor and alarm for BBQ smokers. Works with ETI/ThermoWorks RFX and Billows via ETI Cloud."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jamie Geraghty" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.9",
    "thermoworks-cloud>=0.1.16",
]

[project.optional-dependencies]
pi = [
    "gpiozero>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
smoker = "smoker_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smoker_monitor"]

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls
    "DTZ",      # timezone-naive datetimes (matters for 'last seen' maths)
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["thermoworks_cloud.*", "gpiozero.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "live: talks to the real ETI Cloud; skipped unless SMOKER_LIVE_TESTS=1",
]
