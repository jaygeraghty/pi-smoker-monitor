# Copy to config.toml (git-ignored) and fill in.
# Values here are examples, not recommendations.

[eti_cloud]
email = "you@example.com"
password = "change-me"
# Public Firebase client config for cloud.etiltd.com (published at
# https://cloud.etiltd.com/__/firebase/init.json). Not secrets.
api_key = "AIzaSyBD4snlT2LllO4k0NywX5qYjJ7M7WfU4_I"
app_id = "1:701566661301:web:7a9bc711c05985ead144fc"
referer = "https://cloud.etiltd.com/"

[traeger_mqtt]
# Only required if you wish to connect a traeger grill to the app. can be removed if not needed
email = "you@example.com"
password = "change-me"
# Traegers public login ID. change it if Traeger change it
client_id = "4id473dsrcq4kevlgrikukqn2a"

[polling]
interval_seconds = 30

[display]
units = "C"   # "C" or "F" — ETI Cloud stores °F; we convert for display

[alarms]
# Optional. Any alarm that's on wakes you. Leave a setting out to use its default.
pit_high = true               # pit over its high limit
pit_low = true                # pit under its low limit (fire going out)
probe_high = true             # meat reached its target
probe_low = false             # meat under its low limit (rarely useful)
gateway_timeout = true        # no data from the Gateway...
gateway_timeout_minutes = 5   # ...for this many minutes
probe_timeout = true          # a probe in use has gone quiet...
probe_timeout_minutes = 5     # ...for this many minutes
gateway_battery_pct = 10      # alarm below this; 0 switches it off
probe_battery_pct = 10        # alarm below this; 0 switches it off
eti_unreachable = true        # the Pi can't get data from ETI Cloud...
eti_unreachable_minutes = 5   # ...for this many minutes

[notifiers.sound]
enabled = true
file = "sounds/alarm.wav"

[notifiers.pushover]
enabled = false
app_token = ""
user_key = ""
